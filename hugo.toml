theme = "congo"
baseURL = "https://wasatyogrodnik.github.io/"
defaultContentLanguage = "pl"
languageCode = "pl-PL"
title = "Wąsaty Ogrodnik"
enableRobotsTXT = false

[outputs]
home = ["HTML", "RSS"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
description = "Wąsaty Ogrodnik to blog o działce, kompoście, uprawie warzyw, drzewach owocowych i codziennym życiu działkowca. Praktyczne porady, własne doświadczenia i ogrodnicze notatki."

[params.seo]
titleSeparator = " | "
defaultTitle = "Wąsaty Ogrodnik"
defaultDescription = "Wąsaty Ogrodnik to blog o działce, kompoście, uprawie warzyw, drzewach owocowych i codziennym życiu działkowca. Praktyczne porady, własne doświadczenia i ogrodnicze notatki."
brandVariant = "Wasaty Ogrodnik"
localArea = "ROD Urbanowskiej Konin"