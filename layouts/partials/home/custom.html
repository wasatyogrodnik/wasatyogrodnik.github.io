

<section class="wo-hero">
  <div class="wo-hero__overlay">
    <h1 class="wo-hero__title">{{ .Site.Params.hero.title }}</h1>
    <p class="wo-hero__tagline">{{ .Site.Params.hero.lead }}</p>
    <p class="wo-hero__desc">{{ .Site.Params.hero.desc }}</p>
  </div>
</section>

<section class="wo-home-posts">
  <h2>Co w trawie piszczy</h2>
  <div class="wo-card-grid">
    {{ range first 6 (where site.RegularPages "Type" "in" site.Params.mainSections) }}
      <article class="wo-post-card">
        <a href="{{ .RelPermalink }}">
          <img src="/images/posts/post-thumb-ogrod-ogolny-01.png" alt="{{ .Title }}" class="wo-post-card__thumb">
        </a>
        <div class="wo-post-card__body">
          <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
          <p class="wo-post-card__meta">{{ .Date.Format "2 January 2006" }}</p>
          <p>{{ .Summary | plainify | truncate 140 }}</p>
        </div>
      </article>
    {{ end }}
  </div>
</section>
